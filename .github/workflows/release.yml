name: Release

# A tag such as v1.0.0 makes a GitHub release with the plugin zip.
# The tag must be the same as the version of the plugin.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the PHP syntax
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build the zip
        run: bin/build-zip.sh "${GITHUB_REF_NAME}"

      - name: Get the release notes from the changelog in readme.txt
        run: bin/release-notes.sh "${GITHUB_REF_NAME}" > build/notes.md

      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            # The workflow ran again for the same tag: replace the zip.
            gh release upload "${GITHUB_REF_NAME}" build/free-maps.zip --clobber
          else
            gh release create "${GITHUB_REF_NAME}" build/free-maps.zip \
              --verify-tag \
              --title "Free Maps ${GITHUB_REF_NAME#v}" \
              --notes-file build/notes.md
          fi
