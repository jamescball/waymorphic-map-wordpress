name: Release

# A tag such as v1.0.0 makes a GitHub release with the plugin zip.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the PHP syntax
        run: find . -name '*.php' -not -path './build/*' -print0 | xargs -0 -n1 php -l

      - name: Build the zip
        run: bin/build-zip.sh "${GITHUB_REF_NAME}"

      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" build/waymorphic-map.zip --title "Waymorphic Map ${GITHUB_REF_NAME#v}" --generate-notes
